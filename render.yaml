databases:
  - name: coffee-303-db
    plan: free

services:
  - type: web
    name: coffee-303-inventory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-303-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@303coffee.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Owner
      - key: CURRENCY_CODE
        value: INR
      - key: CURRENCY_SYMBOL
        value: ₹
      - key: OPENAI_API_KEY
        sync: false
      - key: PETPOOJA_WEBHOOK_SECRET
        generateValue: true
      - key: PETPOOJA_APP_KEY
        sync: false
      - key: PETPOOJA_APP_SECRET
        sync: false
      - key: PETPOOJA_ACCESS_TOKEN
        sync: false
      - key: PETPOOJA_REST_ID
        sync: false
