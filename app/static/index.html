<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>303 Coffee — Inventory</title>
    <link rel="icon" href="/static/favicon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=Outfit:wght@380;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=18" />
  </head>
  <body>
    <section id="login-screen" class="login-screen" hidden>
      <form id="login-form" class="panel login-card">
        <img class="brand-logo" src="/static/logo.png?v=3" alt="303 Coffee" />
        <h1>Sign in</h1>
        <p class="muted">Inventory for 303 Coffee.</p>
        <label>Email<input name="email" type="email" required autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="primary" type="submit">Enter back office</button>
        <p id="login-error" class="low" hidden></p>
      </form>
    </section>
    <div id="shell">
      <aside class="sidebar">
        <img class="brand-logo" src="/static/logo.png?v=3" alt="303 Coffee" />
        <h1>Inventory</h1>
        <nav id="nav"></nav>
        <div class="profile-box">
          <p id="whoami" class="muted">—</p>
          <button class="ghost" id="signout" type="button">Sign out</button>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-kicker">Operations</p>
            <h2 id="page-title">Dashboard</h2>
          </div>
            <p class="hint" id="page-hint">What is on the shelf, what to reorder, and what is going off.</p>
        </header>
        <section id="app"></section>
      </main>
    </div>
    <div id="toast" hidden></div>
    <script src="/static/app.js?v=18"></script>
  </body>
</html>
