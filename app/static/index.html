<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>303 Coffee — Inventory & Accounts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=Outfit:wght@380;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=3" />
  </head>
  <body>
    <section id="login-screen" class="login-screen" hidden>
      <form id="login-form" class="panel login-card">
        <p class="eyebrow">303 Coffee</p>
        <h1>Sign in</h1>
        <p class="muted">Staff profiles keep purchases, bills, and recipes accountable.</p>
        <label>Email<input name="email" type="email" required autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="primary" type="submit">Enter back office</button>
        <p id="login-error" class="low" hidden></p>
      </form>
    </section>
    <div id="shell">
      <aside class="sidebar">
        <p class="eyebrow">303 Coffee</p>
        <h1>Back office</h1>
        <nav id="nav"></nav>
        <div class="profile-box">
          <p id="whoami" class="muted">—</p>
          <button class="ghost" id="signout" type="button">Sign out</button>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <p class="eyebrow" id="page-kicker">Operations</p>
            <h2 id="page-title">Dashboard</h2>
          </div>
          <p class="hint" id="page-hint">Stock, recipes, purchases, and the ledger in one place.</p>
        </header>
        <section id="app"></section>
      </main>
    </div>
    <div id="toast" hidden></div>
    <script src="/static/app.js?v=3"></script>
  </body>
</html>
